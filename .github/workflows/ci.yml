name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q .
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_store_connections.py
